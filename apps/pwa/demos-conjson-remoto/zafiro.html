<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio App Preview - Zafiro Theme</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030a16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0;
        }

        /* Smartphone Mockup Container for Desktop & Native Mobile Responsive */
        .device-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            position: relative;
            background-color: #031c3d;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(9, 102, 185, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            .device-container {
                height: 880px;
                border-radius: 40px;
                border: 8px solid #1a2332;
                margin: 20px 0;
            }
        }

        /* Dynamic Custom Background Layer */
        .custom-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        /* Sapphire Blue Gradient Background */
        .bg-gradient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 25%, #0c69c7 0%, #084c98 45%, #042958 80%, #021430 100%);
            z-index: 2;
        }

        /* Radial Halftone Dot Grid Pattern */
        .bg-halftone {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            mask-image: radial-gradient(circle at 50% 30%, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 75%);
            z-index: 3;
            pointer-events: none;
        }

        /* Faint Console Grid Overlay at Bottom */
        .bg-console-texture {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(2, 20, 48, 0) 0%, rgba(1, 10, 26, 0.85) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Android Status Bar */
        .status-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 6px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-icons svg {
            fill: #ffffff;
        }

        /* Header Chat Button */
        .top-header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            padding: 8px 20px;
        }

        .chat-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2982e6, #0056b3);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px rgba(41, 130, 230, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #ffffff;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .chat-btn:active {
            transform: scale(0.92);
        }

        /* Main Content Container */
        .main-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px 100px;
            text-align: center;
        }

        /* Central Radio Logo Wrapper */
        .logo-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            padding: 4px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(12, 105, 199, 0.4);
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background-color: #ffffff;
            transition: opacity 0.3s ease;
        }

        /* Live Pill Badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ff1a2a, #d60012);
            padding: 6px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 14px rgba(230, 0, 20, 0.5);
            margin-bottom: 12px;
        }

        .live-pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        .live-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* Radio Title & Subtitle */
        .radio-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.1;
        }

        .radio-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
            margin-bottom: 28px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* Social Media Icons Bar */
        .social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            text-decoration: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .social-btn:active {
            transform: scale(0.9);
        }

        .social-btn.facebook { background-color: #1877F2; }
        .social-btn.whatsapp { background-color: #25D366; }
        .social-btn.instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }
        .social-btn.web { background-color: #0078D4; }
        .social-btn.youtube { background-color: #FF0000; }

        /* Floating Bottom Player Bar */
        .player-bar {
            position: absolute;
            bottom: 70px;
            left: 16px;
            right: 16px;
            height: 64px;
            background: linear-gradient(135deg, rgba(8, 48, 102, 0.95), rgba(4, 28, 62, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 8px 12px 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        /* Animated Background Visualizer */
        .visualizer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 70px;
            opacity: 0.25;
            pointer-events: none;
        }

        .v-bar {
            width: 3px;
            height: 15%;
            background-color: #3b93ff;
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .visualizer.playing .v-bar {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        .visualizer.playing .v-bar:nth-child(2n) { animation-delay: 0.2s; }
        .visualizer.playing .v-bar:nth-child(3n) { animation-delay: 0.4s; }
        .visualizer.playing .v-bar:nth-child(4n) { animation-delay: 0.1s; }
        .visualizer.playing .v-bar:nth-child(5n) { animation-delay: 0.5s; }

        @keyframes bounce {
            0% { height: 10%; }
            50% { height: 85%; }
            100% { height: 25%; }
        }

        .player-left {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .player-thumb-wrapper {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: #ffffff;
            padding: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .player-thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
        }

        .listening-tag {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            margin-bottom: 2px;
            align-self: flex-start;
            letter-spacing: 0.2px;
        }

        .player-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .play-btn {
            position: relative;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            outline: none;
            transition: transform 0.2s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        /* Bottom Tab Navigation Bar */
        .bottom-nav {
            position: relative;
            z-index: 20;
            background-color: #ffffff;
            height: 64px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 10px 0;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.15);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #707070;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 33.33%;
            text-decoration: none;
        }

        .nav-item svg {
            fill: #707070;
            transition: fill 0.2s ease;
        }

        .nav-item.active {
            color: #0066cc;
            font-weight: 700;
        }

        .nav-item.active svg {
            fill: #0066cc;
        }

        /* Android Home Indicator Bar */
        .android-bar {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background-color: #000000;
            border-radius: 2px;
        }

        /* Error / Loading Indicator */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(3, 28, 61, 0.92);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #2982e6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            </div>

            <div class="player-left">
                <div class="player-thumb-wrapper">
                    <img id="playerMiniLogo" src="https://logos.suena.live/radiocoap.png" alt="Mini Logo">
                </div>
                <div class="player-info">
                    <span class="listening-tag">Estás Escuchando:</span>
                    <div id="playerRadioTitle" class="player-title">RADIO COAP</div>
                    <div id="playerRadioSubtitle" class="player-subtitle">En Vivo | 24 Hs.</div>
                </div>
            </div>

            <button id="playPauseBtn" class="play-btn" title="Reproducir / Pausar">
                <!-- Play Icon -->
                <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="white"><path d="M8 5v14l11-7z"/></svg>
                <!-- Pause Icon -->
                <svg id="pauseIcon" viewBox="0 0 24 24" width="22" height="22" fill="white" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <!-- Bottom Tab Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M12 14c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-4.24-6.24L6.34 6.34C4.89 7.79 4 9.79 4 12s.89 4.21 2.34 5.66l1.42-1.42C6.63 15.11 6 13.63 6 12s.63-3.11 1.76-4.24zm8.48 0L17.66 6.34C19.11 7.79 20 9.79 20 12s-.89 4.21-2.34 5.66l-1.42-1.42C17.37 15.11 18 13.63 18 12s-.63-3.11-1.76-4.24z"/>
                </svg>
                <span>EN VIVO</span>
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                <span>PROGRAMACIÓN</span>
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
                <span>VIDEOS</span>
            </div>

            <!-- Android Gesture Home Bar -->
            <div class="android-bar"></div>
        </div>

    </div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <!-- JavaScript Application Logic -->
    <script>
        // Store current audio stream URL
        let audioStreamUrl = "";
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const visualizer = document.getElementById('visualizer');
        const loaderOverlay = document.getElementById('loaderOverlay');

        // Extract Radio Variable / URL from parameters
        function getRadioConfig() {
            const params = new URLSearchParams(window.location.search);
            
            // Check possible parameter names: 'variable', 'v', 'json', 'radio', 'id'
            let rawVar = params.get('variable') || params.get('v') || params.get('json') || params.get('radio') || params.get('id');

            // Fallback to hash if parameter is in anchor fragment (e.g., #radiocoap)
            if (!rawVar && window.location.hash) {
                rawVar = window.location.hash.replace('#', '').trim();
            }

            // Default fallback variable
            if (!rawVar) {
                rawVar = 'radiocoap';
            }

            // If a full HTTP/HTTPS URL was passed directly
            if (rawVar.startsWith('http://') || rawVar.startsWith('https://')) {
                return {
                    variableName: rawVar.split('/').pop().replace(/\.json$/i, ''),
                    jsonUrl: rawVar
                };
            }

            // Clean filename if user appended .json
            const cleanVar = rawVar.replace(/\.json$/i, '');
            return {
                variableName: cleanVar,
                jsonUrl: `https://cdn.altomarketing.com/apps/suena.live/${cleanVar}.json`
            };
        }

        // WhatsApp number formatting helper
        function formatWhatsappUrl(phone) {
            if (!phone || phone.trim() === "") return "";
            let cleanPhone = phone.replace(/[^\d+]/g, '');
            if (cleanPhone.startsWith('+')) cleanPhone = cleanPhone.substring(1);
            return `https://wa.me/${cleanPhone}`;
        }

        // Safely update social links
        function setSocialLink(id, url) {
            const btn = document.getElementById(id);
            if (!btn) return;

            if (url && url.trim() !== "" && url !== "#") {
                btn.href = url;
                btn.target = "_blank";
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            } else {
                btn.href = "javascript:void(0)";
                btn.style.opacity = "0.6";
            }
        }

        // Fetch JSON data dynamically & populate UI
        async function loadRadioData() {
            const config = getRadioConfig();

            try {
                const response = await fetch(config.jsonUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                populateUI(data, config.variableName);
            } catch (error) {
                console.error("Error loading JSON file:", error);
                // Fallback UI population if fetch fails
                document.getElementById('radioTitle').textContent = config.variableName.toUpperCase();
                document.getElementById('playerRadioTitle').textContent = config.variableName.toUpperCase();
            } finally {
                // Hide Loader smoothly
                loaderOverlay.style.opacity = '0';
                setTimeout(() => {
                    loaderOverlay.style.display = 'none';
                }, 400);
            }
        }

        // Populate HTML elements with JSON data
        function populateUI(data, fallbackVar) {
            const radio = (data.radio && data.radio[0]) ? data.radio[0] : {};
            const panel = (data.panel && data.panel[0]) ? data.panel[0] : {};

            // 1. Logo (from radio_image_url or panel logo_url)
            const logoUrl = panel.logo_url || radio.radio_image_url || 'https://logos.suena.live/radiocoap.png';
            document.getElementById('mainLogo').src = logoUrl;
            document.getElementById('playerMiniLogo').src = logoUrl;

            // 2. Radio Name
            let radioName = "RADIO COAP";
            if (fallbackVar && fallbackVar.toLowerCase() === 'radiocoap') {
                radioName = "RADIO COAP";
            } else if (panel.radio_name && panel.radio_name.trim() !== "") {
                radioName = panel.radio_name;
            } else {
                radioName = fallbackVar ? fallbackVar.toUpperCase() : "RADIO LIVE";
            }

            document.getElementById('radioTitle').textContent = radioName;
            document.getElementById('playerRadioTitle').textContent = radioName;

            // 3. Subtitle / Genre
            const genreText = radio.radio_genre || "EN VIVO | 24 HS.";
            document.getElementById('radioGenre').textContent = "EN VIVO | 24 HS.";
            document.getElementById('playerRadioSubtitle').textContent = "En Vivo | 24 Hs.";

            // 4. Audio Stream URL
            if (radio.radio_url) {
                audioStreamUrl = radio.radio_url;
            }

            // 5. Chat Button URL
            const chatUrl = radio.chatbox_url || panel.chatbox_url;
            const chatBtn = document.getElementById('chatBtn');
            if (chatUrl) {
                chatBtn.href = chatUrl;
            }

            // 6. Social Links
            setSocialLink('facebookBtn', panel.facebook_url);
            setSocialLink('whatsappBtn', formatWhatsappUrl(panel.whatsapp_url || panel.call_url));
            setSocialLink('instagramBtn', panel.instagram_url);
            setSocialLink('webBtn', panel.web_url || panel.dominio_url);
            setSocialLink('youtubeBtn', panel.youtube_url || panel.tiktok_url);

            // 7. Background Image (if custom background is provided)
            if (radio.background_image_url && radio.background_image_url.trim() !== "") {
                const bgLayer = document.getElementById('customBgLayer');
                bgLayer.style.backgroundImage = `url('${radio.background_image_url}')`;
                bgLayer.style.opacity = radio.blur_radio_background === "true" ? "0.2" : "0.4";
            }
        }

        // Live Audio Player Controls
        playPauseBtn.addEventListener('click', toggleAudioPlayback);

        function toggleAudioPlayback() {
            if (!audioStreamUrl) return;

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                visualizer.classList.remove('playing');
            } else {
                if (audioPlayer.src !== audioStreamUrl) {
                    audioPlayer.src = audioStreamUrl;
                }
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    visualizer.classList.add('playing');
                }).catch(err => {
                    console.error("Playback error:", err);
                });
            }
        }

        // Live Clock in Status Bar
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            if (minutes < 10) minutes = '0' + minutes;
            document.getElementById('statusTime').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadRadioData);
    </script>
</body>
</html>
