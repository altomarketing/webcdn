<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio App Preview - Cuarzo Theme</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0606;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0;
        }

        /* Smartphone Mockup Container for Desktop & Native Mobile Responsive */
        .device-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            position: relative;
            background-color: #120505;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(220, 38, 38, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            .device-container {
                height: 880px;
                border-radius: 40px;
                border: 8px solid #241313;
                margin: 20px 0;
            }
        }

        /* Mixing Console Background Image (Right side reveal) */
        .console-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://cdnuploads.pages.dev/uploads/images/fondos/fondo.webp');
            background-size: cover;
            background-position: right center;
            opacity: 0.85;
            z-index: 1;
        }

        /* Curved Red / Orange Gradient Overlay (Left side) */
        .curved-gradient-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .curved-gradient-overlay svg {
            width: 100%;
            height: 100%;
        }

        /* Top Menu Header Bar */
        .top-header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 16px 20px 8px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            outline: none;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 26px;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .menu-text {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Main Content Container */
        .main-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 40px;
            text-align: center;
        }

        /* Upper Section with Logo and Visualizer */
        .logo-section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }

        /* Background Horizontal Equalizer Waveform */
        .waveform-bg {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0.35;
            z-index: 3;
            pointer-events: none;
        }

        .w-bar {
            width: 3px;
            height: 20%;
            background-color: #ffffff;
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .waveform-bg.playing .w-bar {
            animation: waveBounce 1s infinite ease-in-out alternate;
        }

        .waveform-bg.playing .w-bar:nth-child(2n) { animation-delay: 0.15s; }
        .waveform-bg.playing .w-bar:nth-child(3n) { animation-delay: 0.3s; }
        .waveform-bg.playing .w-bar:nth-child(5n) { animation-delay: 0.45s; }

        @keyframes waveBounce {
            0% { height: 15%; }
            50% { height: 95%; }
            100% { height: 30%; }
        }

        /* Central Rotating Logo Outer Container */
        .logo-wrapper {
            position: relative;
            z-index: 5;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            padding: 4px;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(234, 56, 77, 0.5);
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Continuous Rotating Logo Animation */
        .main-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            animation: spin 20s linear infinite;
            transition: animation-play-state 0.3s ease;
        }

        .main-logo.paused {
            animation-play-state: paused;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Sonando en Vivo Capsule Badge */
        .live-badge {
            position: relative;
            z-index: 5;
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        /* Central Big Play / Pause Button */
        .player-center {
            position: relative;
            z-index: 10;
            margin: 10px 0 20px;
        }

        .play-btn-outer {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 6px;
            border: 3px dashed rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: rotateDashed 30s linear infinite;
        }

        @keyframes rotateDashed {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .play-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff3b4e, #c70014);
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            outline: none;
            box-shadow: inset 0 -4px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        /* Right Floating Social Buttons Bar */
        .social-column {
            position: absolute;
            right: 14px;
            top: 52%;
            transform: translateY(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.85);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .social-btn:active {
            transform: scale(0.9);
        }

        .social-btn.whatsapp { background-color: #25D366; }
        .social-btn.web { background-color: #00A0E9; }
        .social-btn.call { background-color: #E91E63; }
        .social-btn.facebook { background-color: #1877F2; }
        .social-btn.tiktok { background-color: #000000; }

        /* Bottom Radio Information Text */
        .bottom-info {
            position: relative;
            z-index: 10;
            margin-top: auto;
            text-align: center;
        }

        .radio-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        .radio-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.3px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* Android Home Indicator Bar */
        .android-bar {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            z-index: 30;
        }

        /* Loader Overlay */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(18, 5, 5, 0.94);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ff3b4e;
            border-radius: 50%;
            animation: spinSpinner 0.8s linear infinite;
        }

        @keyframes spinSpinner {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

    <!-- Hidden Audio Stream -->

    <!-- JavaScript Application Logic -->
    <script>
        let audioStreamUrl = "";
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const mainLogo = document.getElementById('mainLogo');
        const waveform = document.getElementById('waveform');
        const loaderOverlay = document.getElementById('loaderOverlay');

        // Extract Radio Variable / URL from query parameters or anchor
        function getRadioConfig() {
            const params = new URLSearchParams(window.location.search);
            
            let rawVar = params.get('variable') || params.get('v') || params.get('json') || params.get('radio') || params.get('id');

            if (!rawVar && window.location.hash) {
                rawVar = window.location.hash.replace('#', '').trim();
            }

            if (!rawVar) {
                rawVar = 'radiocoap';
            }

            if (rawVar.startsWith('http://') || rawVar.startsWith('https://')) {
                return {
                    variableName: rawVar.split('/').pop().replace(/\.json$/i, ''),
                    jsonUrl: rawVar
                };
            }

            const cleanVar = rawVar.replace(/\.json$/i, '');
            return {
                variableName: cleanVar,
                jsonUrl: `https://cdn.altomarketing.com/apps/suena.live/${cleanVar}.json`
            };
        }

        // WhatsApp number formatting helper
        function formatWhatsappUrl(phone) {
            if (!phone || phone.trim() === "") return "";
            let cleanPhone = phone.replace(/[^\d+]/g, '');
            if (cleanPhone.startsWith('+')) cleanPhone = cleanPhone.substring(1);
            return `https://wa.me/${cleanPhone}`;
        }

        // Phone call link helper
        function formatCallUrl(phone) {
            if (!phone || phone.trim() === "") return "";
            return `tel:${phone.trim()}`;
        }

        // Safely update social links
        function setSocialLink(id, url) {
            const btn = document.getElementById(id);
            if (!btn) return;

            if (url && url.trim() !== "" && url !== "#") {
                btn.href = url;
                btn.target = "_blank";
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            } else {
                btn.href = "javascript:void(0)";
                btn.style.opacity = "0.6";
            }
        }

        // Fetch JSON data dynamically & populate UI
        async function loadRadioData() {
            const config = getRadioConfig();

            try {
                const response = await fetch(config.jsonUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                populateUI(data, config.variableName);
            } catch (error) {
                console.error("Error loading JSON file:", error);
                document.getElementById('radioTitle').textContent = config.variableName.toUpperCase();
                document.getElementById('radioGenre').textContent = "EN VIVO | 24 HS.";
            } finally {
                loaderOverlay.style.opacity = '0';
                setTimeout(() => {
                    loaderOverlay.style.display = 'none';
                }, 400);
            }
        }

        // Populate HTML elements with JSON data
        function populateUI(data, fallbackVar) {
            const radio = (data.radio && data.radio[0]) ? data.radio[0] : {};
            const panel = (data.panel && data.panel[0]) ? data.panel[0] : {};

            // 1. Rotating Logo (from radio_image_url or panel logo_url)
            const logoUrl = panel.logo_url || radio.radio_image_url || 'https://logos.suena.live/radiocoap.png';
            mainLogo.src = logoUrl;

            // 2. Radio Name
            let radioName = "RADIO COAP";
            if (fallbackVar && fallbackVar.toLowerCase() === 'radiocoap') {
                radioName = "RADIO COAP";
            } else if (panel.radio_name && panel.radio_name.trim() !== "") {
                radioName = panel.radio_name;
            } else {
                radioName = fallbackVar ? fallbackVar.toUpperCase() : "RADIO LIVE";
            }

            document.getElementById('radioTitle').textContent = radioName;

            // 3. Subtitle / Genre
            const genreText = radio.radio_genre || "EN VIVO | 24 HS.";
            document.getElementById('radioGenre').textContent = genreText;

            // 4. Audio Stream URL
            if (radio.radio_url) {
                audioStreamUrl = radio.radio_url;
            }

            // 5. Social Links
            setSocialLink('whatsappBtn', formatWhatsappUrl(panel.whatsapp_url || panel.call_url));
            setSocialLink('webBtn', panel.web_url || panel.dominio_url);
            setSocialLink('callBtn', formatCallUrl(panel.call_url || panel.whatsapp_url));
            setSocialLink('facebookBtn', panel.facebook_url);
            setSocialLink('tiktokBtn', panel.tiktok_url || panel.instagram_url);

            // 6. Custom console / background image if provided
            if (radio.background_image_url && radio.background_image_url.trim() !== "") {
                const bgLayer = document.getElementById('customBgLayer');
                bgLayer.style.backgroundImage = `url('${radio.background_image_url}')`;
            }
        }

        // Audio Playback Controls
        playPauseBtn.addEventListener('click', toggleAudioPlayback);

        function toggleAudioPlayback() {
            if (!audioStreamUrl) return;

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                waveform.classList.remove('playing');
                mainLogo.classList.add('paused');
            } else {
                if (audioPlayer.src !== audioStreamUrl) {
                    audioPlayer.src = audioStreamUrl;
                }
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    waveform.classList.add('playing');
                    mainLogo.classList.remove('paused');
                }).catch(err => {
                    console.error("Playback error:", err);
                });
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadRadioData);
    </script>
</body>
</html>
